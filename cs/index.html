<style>
  :root{
    --bg:#0f1115; --card:#1a1d24; --line:#2a2f3a;
    --tx:#f3f4f6; --dim:#9aa3b2;
    --hi:#2dd4bf; --warn:#fbbf24; --bad:#f87171; --ok:#34d399; --lock:#6b7280;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; padding:0}
  body{
    background:var(--bg); color:var(--tx);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
    font-size:17px; line-height:1.45;
    padding:0 0 60px; padding-bottom:calc(60px + env(safe-area-inset-bottom));
    -webkit-text-size-adjust:100%;
  }
  .wrap{max-width:620px; margin:0 auto; padding:0 14px}
  header{position:sticky; top:0; z-index:5; background:var(--bg); padding:10px 0 8px; border-bottom:1px solid var(--line)}
  .hrow{display:flex; align-items:center; gap:10px}
  .hrow h1{font-size:19px; margin:0; flex:1}
  .badge{background:var(--bad); color:#fff; font-weight:800; font-size:14px; border-radius:999px; padding:2px 10px; min-width:28px; text-align:center}
  .badge.zero{background:var(--line); color:var(--dim)}
  .hupd{font-size:13px; color:var(--dim); margin-top:3px}
  .hupd .stale{color:var(--warn)}
  button{font:inherit; border:0; border-radius:12px; cursor:pointer}
  .rf{background:var(--line); color:var(--tx); padding:8px 12px; font-size:14px}
  .rf.busy{opacity:.5}
  .tabs{display:flex; gap:8px; margin:10px 0 4px}
  .tabs button{flex:1; padding:12px; font-size:16px; font-weight:800; background:var(--card); color:var(--dim); border:1px solid var(--line)}
  .tabs button.on{background:var(--hi); color:#04211c; border-color:var(--hi)}
  h2{font-size:14px; color:var(--dim); font-weight:700; margin:16px 0 6px; letter-spacing:.3px}
  .list{background:var(--card); border:1px solid var(--line); border-radius:14px; overflow:hidden}
  .item{padding:12px 14px; border-top:1px solid var(--line)}
  .item:first-child{border-top:0}
  .it-top{display:flex; gap:8px; align-items:baseline; flex-wrap:wrap}
  .ch{font-size:12.5px; font-weight:800; color:#04211c; background:var(--hi); border-radius:7px; padding:1px 7px}
  .ty{font-weight:800}
  .ty.date{color:var(--warn)}
  .ord{font-size:14px; color:var(--dim); word-break:break-all}
  .it-mid{margin-top:4px; font-size:16px}
  .it-mid b{color:var(--tx)}
  .it-sub{font-size:13px; color:var(--dim); margin-top:3px; word-break:break-all}
  .it-sub a{color:var(--hi)}
  .it-act{display:flex; gap:8px; margin-top:9px; align-items:center; flex-wrap:wrap}
  .it-act button{padding:9px 13px; font-size:14px; font-weight:800}
  .b-done{background:var(--ok); color:#04211c}
  .b-cancel{background:transparent; color:var(--dim); border:1px solid var(--line)}
  .lockmsg{font-size:13.5px; color:var(--lock); background:#151820; border:1px dashed var(--line); border-radius:9px; padding:6px 10px}
  .lockmsg.today{color:var(--warn); border-color:var(--warn)}
  .empty{padding:18px 14px; color:var(--dim); text-align:center}
  .err{background:#3b1d1d; border:1px solid var(--bad); color:#fecaca; border-radius:12px; padding:10px 12px; margin:10px 0; font-size:14.5px}
  .msg{background:#123a33; border:1px solid var(--ok); color:#bbf7d0; border-radius:12px; padding:10px 12px; margin:10px 0; font-size:14.5px}
  /* 입력 폼 */
  .form{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px 14px; margin-top:8px}
  .f{margin:8px 0 12px}
  .f label{display:block; font-size:13.5px; color:var(--dim); margin-bottom:5px}
  .f label b{color:var(--warn)}
  .chips{display:flex; flex-wrap:wrap; gap:7px}
  .chips button{background:#22262f; color:var(--tx); border:1px solid var(--line); padding:10px 13px; font-size:15px}
  .chips button.on{background:var(--hi); color:#04211c; border-color:var(--hi); font-weight:800}
  input[type=text],input[type=date]{width:100%; font:inherit; font-size:17px; background:#0f1115; color:var(--tx); border:1px solid var(--line); border-radius:10px; padding:11px 12px}
  input:focus{outline:2px solid var(--hi)}
  .hint{font-size:13px; color:var(--dim); margin-top:5px}
  .b-save{width:100%; padding:15px; font-size:18px; font-weight:900; background:var(--hi); color:#04211c; margin-top:6px}
  .b-save:disabled{opacity:.5}
  .dupwarn{color:var(--warn); font-size:14px; margin-top:8px}
  .recent{margin-top:14px}
  .toast{position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:#fff; color:#111; font-weight:800; padding:12px 18px; border-radius:12px; box-shadow:0 6px 20px rgba(0,0,0,.4); z-index:9; display:none; max-width:92vw; text-align:center}
  small{color:var(--dim)}
</style>
</head>

<div class="wrap">
  <header>
    <div class="hrow">
      <h1>📝 CS 장부</h1>
      <span class="badge zero" id="badge">0</span>
      <button class="rf" id="rf" onclick="load(true)">새로고침</button>

    <div class="hupd" id="hupd">불러오는 중…</div>
    <div class="tabs">
      <button id="tab-todo" class="on" onclick="showTab('todo')">오늘 할 일</button>
      <button id="tab-add" onclick="showTab('add')">＋ 접수</button>
    </div>
  </header>

  <div id="err"></div>
  <div id="msg"></div>

  <div id="pane-todo"></div>

    <div class="form">
      <div class="f"><label>채널 <b>*</b></label><div class="chips" id="c-ch"></div></div>
      <div class="f"><label>주문번호 <b>*</b></label>
        <input type="text" id="i-order" placeholder="주문번호 붙여넣기" inputmode="numeric" autocomplete="off">
        <div class="dupwarn" id="dup"></div>
      </div>
      <div class="f"><label>유형 <b>*</b></label><div class="chips" id="c-type"></div></div>
      <div class="f" id="f-new">
        <label id="l-new">새값 <b>*</b></label>
        <input type="date" id="i-newdate" style="display:none">
        <input type="text" id="i-newtext" placeholder="예: 핑크 → 블루 / 새 주소 / 요청 내용" style="display:none">
        <div class="hint" id="h-new"></div>
      </div>
      <div class="f"><label>원래값 <small>(선택)</small></label>
        <input type="text" id="i-old" placeholder="예: 2026-09-02 / 핑크" autocomplete="off"></div>
      <div class="f"><label>요청경로</label><div class="chips" id="c-via"></div>
        <div class="hint" id="h-via"></div></div>
      <div class="f"><label>증빙 링크 <small>(캡처 드라이브 링크 · 나중에 시트에서 넣어도 됨)</small></label>
        <input type="text" id="i-proof" placeholder="https://drive.google.com/…" inputmode="url" autocomplete="off"></div>
      <div class="f"><label>입력자 <b>*</b></label><div class="chips" id="c-who"></div></div>
      <button class="b-save" id="b-save" onclick="save()">장부에 적기</button>
    </div>
    <div class="recent" id="recent"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
// ★★ 배포 시 여기만 바꾸세요 — CS 웹앱(Apps Script)의 exec 주소 ★★
const CS_URL = 'https://script.google.com/macros/s/AKfycbwmFjRFl93nYHAyKew70v9OYDWl9GdhqdgNAwUMzLxWEPDipWjLHKvypbxxaxK0yOsLUg/exec';

const AUTO_MS = 5 * 60 * 1000;   // 5분마다 자동 새로고침
const DATE_TYPES = { '당기기':1, '미루기':1 };
const OPEN = { '대기':1, '반영':1 };
let DATA = null, busy = false, TAB = 'todo';
const F = { ch:'', type:'', via:'', who:'' };

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function md(iso){ const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(iso||''); return m ? (+m[2])+'/'+(+m[3]) : (iso||''); }
function wd(iso){ const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(iso||''); if(!m) return ''; return ['일','월','화','수','목','금','토'][new Date(+m[1],+m[2]-1,+m[3]).getDay()]; }
function toast(t){ const e=$('toast'); e.textContent=t; e.style.display='block'; clearTimeout(toast._t); toast._t=setTimeout(()=>e.style.display='none',2200); }
function setMsg(t){ $('msg').innerHTML = t ? '<div class="msg">'+t+'</div>' : ''; }
function setErr(t){ $('err').innerHTML = t ? '<div class="err">'+t+'</div>' : ''; }

/* ───── 불러오기 ───── */
function load(manual){
  if(busy) return;
  busy = true; $('rf').classList.add('busy');
  fetch(CS_URL + (CS_URL.indexOf('?')<0?'?':'&') + 't=' + Date.now(), {method:'GET'})
    .then(r => r.json())
    .then(j => {
      if(!j || j.ok === false) throw new Error((j && j.error) || '데이터 오류');
      DATA = j; setErr('');
      // 입력자 기억(폰마다)
      try{ const w = localStorage.getItem('cs_who'); if(w && j.lists.who.indexOf(w)>=0 && !F.who) F.who = w; }catch(_){}
      render();
    })
    .catch(e => {
      setErr('지금 못 불러왔어요 — ' + esc(e.message) + (DATA ? '<br>아래는 마지막으로 받은 내용입니다.' : ''));
    })
    .then(() => { busy = false; $('rf').classList.remove('busy'); });
}

/* ───── 분류 ─────
   오늘 처리 : 날짜 아닌 유형(전부) + 날짜 유형 중 새값 ≤ 오늘(발송 확인 후 완료)
   예정      : 날짜 유형 중 새값 > 오늘 (잡이 붙잡는 중 · 완료 잠금)                */
function classify(){
  const today = DATA.nowDate;
  const open = DATA.rows.filter(r => OPEN[r.status]);
  const todo = [], later = [];
  open.forEach(r => {
    if(DATE_TYPES[r.type] && r.newv > today) later.push(r); else todo.push(r);
  });
  later.sort((a,b) => a.newv < b.newv ? -1 : 1);
  return { todo, later, today };
}

function render(){
  const d = DATA;
  const c = classify();
  $('badge').textContent = c.todo.length;
  $('badge').className = 'badge' + (c.todo.length ? '' : ' zero');
  $('hupd').innerHTML = md(d.nowDate) + '(' + wd(d.nowDate) + ') · 갱신 <b>' + esc(d.nowHM) + '</b> · 열린 건 ' + (c.todo.length + c.later.length);
  renderTodo(c);
  renderForm();
  renderRecent();
}

function itemHTML(r, c){
  const isDate = !!DATE_TYPES[r.type];
  let mid = '';
  if(isDate){
    mid = (r.oldv ? esc(r.oldv) + ' → ' : '') + '<b>' + esc(r.newv) + ' (' + wd(r.newv) + ')</b>';
  } else {
    mid = (r.oldv ? esc(r.oldv) + ' → ' : '') + '<b>' + esc(r.newv) + '</b>';
  }
  let sub = [];
  if(r.via) sub.push(esc(r.via));
  if(r.who) sub.push(esc(r.who));
  if(r.at) sub.push('접수 ' + esc(r.at));
  if(r.status === '반영') sub.push('<span style="color:var(--ok)">잡 반영됨</span>');
  else if(isDate) sub.push('<span style="color:var(--warn)">잡 반영 대기(다음 정시 런)</span>');
  if(r.proof) sub.push('<a href="' + esc(r.proof) + '" target="_blank" rel="noopener">증빙</a>');
  if(r.memo) sub.push('<span>' + esc(r.memo) + '</span>');

  let act = '';
  const locked = isDate && r.newv > c.today;
  if(locked){
    act = '<div class="lockmsg">🔒 ' + md(r.newv) + '(' + wd(r.newv) + ') 아침 잡이 자동 발송 — 그때까지 완료 잠금</div>' +
          '<button class="b-cancel" onclick="done(' + r.row + ',\'취소\')">요청 취소</button>';
  } else if(isDate){
    act = '<div class="lockmsg today">📦 ' + (r.newv === c.today ? '오늘' : md(r.newv)) + ' 자동 발송분 — 발송취합·송장 확인 후 완료</div>' +
          '<button class="b-done" onclick="done(' + r.row + ',\'완료\')">✓ 발송 확인·완료</button>' +
          '<button class="b-cancel" onclick="done(' + r.row + ',\'취소\')">취소</button>';
  } else {
    act = '<button class="b-done" onclick="done(' + r.row + ',\'완료\')">✓ 처리 완료</button>' +
          '<button class="b-cancel" onclick="done(' + r.row + ',\'취소\')">취소</button>';
  }
  return '<div class="item" data-row="' + r.row + '">' +
    '<div class="it-top"><span class="ch">' + esc(r.ch) + '</span><span class="ty' + (isDate?' date':'') + '">' + esc(r.type) + '</span><span class="ord">' + esc(r.order) + '</span></div>' +
    '<div class="it-mid">' + mid + '</div>' +
    (sub.length ? '<div class="it-sub">' + sub.join(' · ') + '</div>' : '') +
    '<div class="it-act">' + act + '</div></div>';
}

function renderTodo(c){
  let h = '<h2>★ 오늘 처리할 CS ' + c.todo.length + '건</h2><div class="list">';
  if(c.todo.length) c.todo.forEach(r => h += itemHTML(r, c));
  else h += '<div class="empty">오늘 처리할 CS가 없습니다 🙂</div>';
  h += '</div>';
  h += '<h2>예정 (잡이 붙잡고 있는 날짜 변경) ' + c.later.length + '건</h2><div class="list">';
  if(c.later.length) c.later.forEach(r => h += itemHTML(r, c));
  else h += '<div class="empty">예정된 날짜 변경 없음</div>';
  h += '</div>';
  $('pane-todo').innerHTML = h;
}

/* ───── 완료/취소 ───── */
function done(row, status){
  const r = DATA.rows.find(x => x.row === row);
  if(!r) return;
  const q = status === '완료'
    ? (r.ch + ' ' + r.order + ' · ' + r.type + '\n처리 완료로 표시할까요?')
    : (r.ch + ' ' + r.order + ' · ' + r.type + '\n이 요청을 취소할까요?' + (DATE_TYPES[r.type] ? '\n(취소하면 잡이 원래 날짜로 돌아갑니다)' : ''));
  if(!confirm(q)) return;
  let note = '';
  if(status === '취소'){ note = prompt('취소 사유 한 줄(선택)', '') || ''; }
  post({ op:'done', row:row, order:r.order, status:status, who:F.who, note:note })
    .then(j => { toast(status + ' 처리됨'); load(true); })
    .catch(e => setErr(esc(e.message)));
}

function post(body){
  return fetch(CS_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(body) })
    .then(r => r.json())
    .then(j => { if(!j || j.ok === false) throw new Error((j && j.error) || '저장 실패'); return j; });
}

/* ───── 접수 폼 ───── */
function chips(id, list, key){
  $(id).innerHTML = list.map(v => '<button class="' + (F[key]===v?'on':'') + '" onclick="pick(\'' + key + '\',\'' + esc(v) + '\')">' + esc(v) + '</button>').join('');
}
function pick(key, v){
  F[key] = (F[key] === v && key !== 'who') ? '' : v;
  if(key === 'who'){ try{ localStorage.setItem('cs_who', v); }catch(_){} }
  renderForm();
  if(key === 'type' || key === 'ch') checkDup();
}
function renderForm(){
  const L = DATA.lists;
  chips('c-ch', L.ch, 'ch'); chips('c-type', L.type, 'type'); chips('c-via', L.via, 'via'); chips('c-who', L.who, 'who');
  const isDate = !!DATE_TYPES[F.type];
  $('i-newdate').style.display = isDate ? '' : 'none';
  $('i-newtext').style.display = (!isDate && F.type) ? '' : 'none';
  $('l-new').innerHTML = isDate ? '새 발송일 <b>*</b>' : '새값(무엇으로) <b>*</b>';
  $('h-new').textContent = !F.type ? '유형을 먼저 고르세요.' :
    (F.type === '당기기' ? '더 이른 날짜. 잡이 그 날짜에 자동 발송(페널티 없음).' :
     F.type === '미루기' ? '더 늦은 날짜. 잡이 그 날짜까지 붙잡았다가 자동 발송. 옛 기한 다음날 판매자센터 빨간 표시·2점 1회 = 정상.' :
     '사람이 처리하는 건 — 아침 알림 "오늘 처리할 CS"에 뜹니다.');
  $('h-via').textContent = F.via === '전화' ? '전화는 기록이 없어요 → 통화 직후 확인 문자 1통 보내고 그 화면을 캡처해 증빙으로.' : '';
}
function checkDup(){
  const o = $('i-order').value.trim();
  if(!o || !DATA){ $('dup').textContent=''; return; }
  const n = DATA.rows.filter(r => r.order === o && OPEN[r.status] && (!F.ch || r.ch === F.ch)).length;
  $('dup').textContent = n ? ('⚠ 이 주문에 아직 안 끝난 CS가 ' + n + '건 있어요 — 재변경이면 그대로 저장(아래 줄이 우선).') : '';
}
$('i-order').addEventListener('input', checkDup);

function save(){
  if(!DATA) return;
  const isDate = !!DATE_TYPES[F.type];
  const order = $('i-order').value.trim();
  const newv = isDate ? $('i-newdate').value.trim() : $('i-newtext').value.trim();
  if(!F.ch) return setErr('채널을 고르세요.');
  if(!order) return setErr('주문번호를 넣으세요.');
  if(!F.type) return setErr('유형을 고르세요.');
  if(isDate && !/^\d{4}-\d{2}-\d{2}$/.test(newv)) return setErr('새 발송일을 달력에서 고르세요.');
  if(!isDate && !newv) return setErr('새값(무엇으로 바꾸는지)을 적으세요.');
  if(!F.who) return setErr('입력자를 고르세요.');
  if(isDate && newv < DATA.nowDate && !confirm(newv + '는 이미 지난 날짜예요. 그래도 저장할까요?')) return;
  setErr('');
  $('b-save').disabled = true;
  post({ op:'add', ch:F.ch, order:order, type:F.type, oldv:$('i-old').value.trim(), newv:newv,
         via:F.via, proof:$('i-proof').value.trim(), who:F.who })
    .then(j => {
      toast('장부에 적었어요 (' + j.row + '행)');
      setMsg('✅ ' + esc(F.ch) + ' ' + esc(order) + ' · ' + esc(F.type) + ' → ' + esc(newv) + ' 저장됨. ' +
        (isDate ? '다음 정시 런(매시 :05)부터 잡이 반영합니다.' : '아침 알림 "오늘 처리할 CS"에 뜹니다.'));
      $('i-order').value=''; $('i-newdate').value=''; $('i-newtext').value=''; $('i-old').value=''; $('i-proof').value='';
      F.type=''; F.via=''; $('dup').textContent='';
      load(true);
    })
    .catch(e => setErr(esc(e.message)))
    .then(() => { $('b-save').disabled = false; });
}

function renderRecent(){
  const rows = DATA.rows.slice(-5).reverse();
  if(!rows.length){ $('recent').innerHTML=''; return; }
  let h = '<h2>최근 적은 5건</h2><div class="list">';
  rows.forEach(r => {
    h += '<div class="item"><div class="it-top"><span class="ch">' + esc(r.ch) + '</span><span class="ty">' + esc(r.type) + '</span><span class="ord">' + esc(r.order) + '</span></div>' +
         '<div class="it-sub">' + esc(r.newv) + ' · ' + esc(r.status) + (r.at ? ' · ' + esc(r.at) : '') + '</div></div>';
  });
  $('recent').innerHTML = h + '</div>';
}

function showTab(t){
  TAB = t;
  $('tab-todo').className = t==='todo' ? 'on' : '';
  $('tab-add').className = t==='add' ? 'on' : '';
  $('pane-todo').style.display = t==='todo' ? '' : 'none';
  $('pane-add').style.display = t==='add' ? '' : 'none';
  setMsg(''); setErr('');
}

load(false);
setInterval(() => { if(TAB === 'todo') load(false); }, AUTO_MS);
document.addEventListener('visibilitychange', () => { if(!document.hidden && TAB === 'todo') load(false); });
</script>
</body>
</html>
