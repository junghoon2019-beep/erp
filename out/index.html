<!-- v3 (2026-08-06): QUICK 출고 추가 — 주문 여러 건을 묶어 5종 필요수량 자동 합산 → 순서대로 출고.
     분해표 원본 = 시트 숨은 탭 '구성표(수정❌)' (스크립트 v3의 calc로 내려받음).
     기존 일반 출고 흐름은 변경 없음(추가만).
     v3.1 (2026-08-07): QUICK 2단계 — [오늘 발송분 불러오기] 버튼 추가.
     서버 송장자동화 로그(오늘 live·성공 건)를 스크립트 v4가 집계해 내려주면(todayOrders)
     수량 입력이 자동으로 채워진다. 매핑 안 된 상품은 경고로 표시.
     v3.2 (2026-08-11): ② 필요수량에서 '오늘 이미 기록된 일반출고'를 상품코드별로 차감 →
     남은 물량만 출고한다(하루 2회째 QUICK 중복출고 방지). 차감 근거를 화면에 표시하고
     [차감 끄기]로 언제든 주문 전량 보기로 되돌릴 수 있다. 서버·Apps Script 무변경.
     v3.2.1 (2026-08-11): 매니페스트 scope를 '/erp/' 폴더 전체 → '자기 파일'로 좁힘.
     (폴더 범위로 두면 같은 폴더의 다른 앱을 크롬이 같은 앱으로 취급해 ship 앱이 열렸다.)
     v3.3 (2026-08-11): QUICK 입구를 [주문 출고] / [수동 출고] 둘로 분리.
     수동 출고 = 원래 설계 v1의 '출고수량계산기' — 서비스·샘플 등 주문 외 물량.
     자동 채우기·기출고 차감을 걸지 않고, 사유를 골라 memo에 남긴다.
     차감 계산은 memo가 붙은(=주문 외) 기록을 제외한다 → 서비스 출고가 주문 차감을 오염시키지 않는다.
     v3.4 (2026-08-22): "오늘 발송분" → "미출고 주문분" 개편.
     ① 창을 오늘 하루 → 최근 10일로 넓힘. 스크립트 v4.1+ 의 recentOrders를 쓴다.
        연휴에 밀린 주문이 화면에서 통째로 사라지던 문제(8/18 실측) 해결.
        구버전 스크립트(v4)에 붙어도 죽지 않게, recentOrders가 없으면 todayOrders로 자동 후퇴.
     ② 차감도 같은 창으로. '오늘 기출고'만 빼던 것을 '창 안 기출고' 전체로 넓혀 대칭을 맞춤.
        (주문 창과 차감 창이 다르면 이미 나간 물량을 또 내보내게 된다.)
     ③ '주문 N개 − 기출고 M개'를 항상 표시. 창 경계 오차를 사람이 눈으로 잡게 하는 장치.
     ④ 빈 상태 문구 4종 신설. 종전에는 주문이 0이면 버튼이 그냥 사라져 고장과 구분이 안 됐다.
        못 받아옴 / 오류 / 발송은 있으나 에너지바 없음 / 주문 자체 없음 을 각각 다르게 표시.
     v3.4.1 (2026-08-22): 속도 체감 문제 대응.
     ⑤ 스톱워치 내장 — '재고 새로고침' 후 총/통신/서버/화면 시간을 실제 숫자로 표시.
        서버 시간만 재고 끝냈던 것이 잘못이었다. 대표 체감 3초(스톱워치 실측)와 서버 1.45초의
        차이가 어디서 나는지 앱이 직접 재게 한다. SHOW_TIMING=false 로 언제든 끌 수 있다.
     ⑥ 완료 후 버튼 붙들기 1.5초 → 0.6초. 데이터는 이미 왔는데 기다리는 것처럼 보였다. -->

<style>
  /* ===== 현장용 디자인 원칙 =====
     - 장갑 낀 손/추운 창고 고려: 버튼·글씨 크게, 터치 영역 넉넉히
     - 컴퓨터 약한 직원 고려: 한 화면 한 가지 일, 큰 단계 표시
     - 실수 방지: 재고보다 많이 못 빼게, 확인 단계, 임박순 강조      */
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  :root{
    --bg:#0f1b14; --card:#17271d; --card2:#1d3327;
    --line:#2c4636; --txt:#eafff2; --dim:#8fb8a0;
    --accent:#36d97b; --accent-d:#1f7d48;
    --urgent:#ff5d5d; --urgent-bg:#3a1717;
    --warn:#ffb84d; --warn-bg:#3a2d12;
    --safe:#4db5ff; --safe-bg:#13283a;
  }
  body{
    font-family:'Apple SD Gothic Neo','Malgun Gothic',-apple-system,sans-serif;
    background:var(--bg); color:var(--txt);
    max-width:480px; margin:0 auto; min-height:100vh;
    display:flex; flex-direction:column;
  }
  /* 상단 바 */
  .top{
    background:var(--card); padding:18px 20px;
    display:flex; align-items:center; gap:12px;
    border-bottom:2px solid var(--line); position:sticky; top:0; z-index:10;
  }
  .top .back{
    font-size:28px; width:44px; height:44px; line-height:44px; text-align:center;
    background:var(--card2); border-radius:12px; cursor:pointer; user-select:none;
    display:none;
  }
  .top.has-back .back{ display:block; }
  .top h1{ font-size:21px; font-weight:800; letter-spacing:-0.5px; }
  .top .sub{ font-size:13px; color:var(--dim); font-weight:500; margin-top:2px; }
  /* 단계 표시 */
  .steps{ display:flex; gap:6px; padding:14px 20px 4px; }
  .steps .s{ flex:1; height:6px; border-radius:3px; background:var(--line); }
  .steps .s.on{ background:var(--accent); }
  /* 본문 */
  .body{ flex:1; padding:16px 20px 120px; }
  .hint{ font-size:15px; color:var(--dim); margin:4px 0 16px; font-weight:600; }
  /* 재고 새로고침 줄 */

let ORDERS_STATE='pending';
let quickDeduct=true;    // [v3.2] ②에서 기출고를 뺄지 (기본 켬 · 화면에서 끌 수 있음)
// [v3.3] QUICK 모드 — 'order'(주문 출고) | 'manual'(수동 출고=계산기)
//   manual: 자동 채우기·기출고 차감을 걸지 않는다. 사유를 골라 기록 memo에 남긴다.
let quickMode='order';
const WHY_LIST=['서비스(맛보기)','샘플','내부사용','기타'];
let whyPick='', whyEtc='';

// ===== 작업자(출고관리자) =====
// 시트 '작업자목록' B열에서 받아오기 전/실패 시 쓰는 기본 목록.
// (받아오면 시트 최신값으로 덮어씀 → 시트만 고치면 화면도 따라옴)
let WORKERS=['김현정','이성은','김경희','이정훈','문예지','한규리','최보경','배인경'];
let currentWorker='';  // 직전에 고른 작업자 기억(같은 사람이 LOT 여러 개 연달아 찍을 때 편함)

// 페이지 열릴 때(또는 '재고 새로고침' 버튼) 시트에서 한 번에 받아온다.
//   workers(작업자) + lots(현재 LOT 재고) + today(오늘 날짜) + [v3] calc(QUICK 분해표)
// 실패해도 화면은 기본 목록·기본 LOT(코드 박힌 샘플)으로 계속 동작.
let SHEET_TODAY='';   // 시트가 알려준 오늘 날짜(받기 전엔 빈값)
function loadFromSheet(opts){
  opts = opts || {};
  if(SHEET_URL.indexOf('http')!==0) return;
  if(opts.btn){ opts.btn.disabled=true; opts.btn.textContent='불러오는 중…'; }
  // [v3.4.1] 스톱워치. t0 = 누른 순간 / tNet = 데이터가 다 도착한 순간 / 끝 = 화면까지 그린 순간
  const t0 = Date.now();
  let tNet = 0;
  const url = SHEET_URL + (SHOW_TIMING ? '?diag=1' : '');
  fetch(url,{method:'GET'})
    .then(r=>r.json())
    .then(res=>{
      tNet = Date.now() - t0;
      // (1) 작업자 목록
      if(res && Array.isArray(res.workers) && res.workers.length){
        WORKERS=res.workers;
        const sel=document.getElementById('workerSelect');
        if(sel) fillWorkerSelect(sel);   // 수량 화면이 떠 있으면 다시 채움
      }
      // (2) 오늘 날짜
      if(res && res.today) SHEET_TODAY=res.today;
      // [v2] 최근 5일 출고기록 (하단 '최근 출고 내역'에 표시)
      if(res && Array.isArray(res.records)) RECENTS=res.records;
      // [v3] QUICK 분해표 — 비어 있다가 처음 받아졌고 QUICK 입력 화면이면 다시 그림
      if(res && res.calc && Array.isArray(res.calc.items) && res.calc.items.length){
        const wasEmpty = !CALC.items.length;
        CALC = res.calc;
        if(wasEmpty && view==='quick') render();
      }
      // [v3.1→v3.4] 주문 집계.
      //   스크립트 v4.1+ = recentOrders(최근 N일) · 구버전 v4 = todayOrders(오늘)만.
      //   둘 다 없으면 상태를 건드리지 않는다(= 계속 '못 받음'으로 남는다).
      if(res && res.todayOrders) TODAY_ORDERS = res.todayOrders;
      if(res && (res.recentOrders || res.todayOrders)){
        const wasNull = !ORDERS;
        ORDERS = res.recentOrders || res.todayOrders;
        ORDERS_STATE = 'ok';
        if((wasNull || view==='quick') && (view==='quick'||view==='products')) render();
      }
      // (3) LOT 재고 — 시트는 left로 주는데 이 화면은 days를 쓰므로 left→days 매핑
      if(res && Array.isArray(res.lots) && res.lots.length){
        LOTS = res.lots.map(l=>({
          lot:   l.lot,
          code:  l.code,
          stock: Number(l.stock)||0,
          exp:   l.exp || '',
          days:  (l.left!=null ? Number(l.left) : 0)   // ← left→days 매핑
        }));
        // 상품/LOT 화면이 떠 있으면 새 재고로 다시 그림 (수량 입력 중이면 건드리지 않음)
        if(view==='products' || view==='lots') render();
      }
      if(opts.btn){
        // [v3.4.1] 실제로 걸린 시간을 보여준다. 추측 대신 숫자.
        const tot = Date.now() - t0;
        if(SHOW_TIMING){
          const raw = (res && res.diag && res.diag.total) ? res.diag.total : 0;
          const srv = Math.min(raw, tNet);              // 서버 시간이 총시간을 넘을 수 없게
          const net = Math.max(0, tNet - srv);          // 통신 왕복 = 도착까지 − 서버계산
          const draw = Math.max(0, tot - tNet);         // 화면 그리기
          opts.btn.textContent = '✓ 받음 ('+(tot/1000).toFixed(1)+'초)';
          showToast('⏱ 총 '+(tot/1000).toFixed(1)+'초<br>'
                  + '통신 '+(net/1000).toFixed(1)+'초 · 서버 '+(srv/1000).toFixed(1)+'초 · 화면 '+(draw/1000).toFixed(1)+'초');
          console.log('[속도] 총', tot, 'ms / 통신', net, '/ 서버', srv, '/ 화면', draw, res && res.diag);
        } else {
          opts.btn.textContent='✓ 최신 재고 받음';
        }
        // 붙들기 1.5초 → 0.6초. 데이터는 이미 왔는데 버튼이 기다리는 것처럼 보였다.
        setTimeout(()=>resetReloadBtn(opts.btn),600);
      }
    })
    .catch(err=>{
      console.log('시트에서 받아오기 실패 — 기본값 사용:', err);
      // [v3.4] 통신 실패를 기록한다. "주문 0건"과 반드시 구분해야 한다.
      //   이미 한 번 잘 받아둔 게 있으면 그 값을 살려둔다(화면이 비지 않게).
      if(ORDERS_STATE!=='ok') ORDERS_STATE='fail';
      if(view==='quick'||view==='products') render();
      if(opts.btn){ opts.btn.textContent='⚠ 실패 · 다시'; setTimeout(()=>resetReloadBtn(opts.btn),1800); }
    });
}
// 이전 이름(loadWorkers)으로도 부를 수 있게 별칭 유지
function loadWorkers(){ loadFromSheet(); }
function resetReloadBtn(btn){ if(btn){ btn.disabled=false; btn.textContent='🔄 재고 새로고침'; } }
function fillWorkerSelect(sel){
  const opts=['<option value="">— 작업자 선택 —</option>']
    .concat(WORKERS.map(w=>`<option value="${w}" ${w===currentWorker?'selected':''}>${w}</option>`));
  sel.innerHTML=opts.join('');
  sel.value=currentWorker||'';
  sel.classList.toggle('unset', !sel.value);
}
function onWorkerChange(sel){
  currentWorker=sel.value||'';
  sel.classList.toggle('unset', !currentWorker);
  render();   // 버튼 잠금/해제 + 안내 갱신
}
function workerOk(){ return !!currentWorker; }

const $=id=>document.getElementById(id);
const screen=$('screen'), footer=$('footer'), topBar=$('top');

function prodName(code){ return PRODUCTS.find(p=>p.code===code).name; }
function prodColor(code){ return PRODUCTS.find(p=>p.code===code).color; }
function stockOf(code){ return LOTS.filter(l=>l.code===code).reduce((s,l)=>s+l.stock,0); }
function badge(days){
  if(days<40) return ['urgent','임박 D-'+days];
  if(days<60) return ['warn','D-'+days];
  return ['safe','D-'+days];
}

function render(){
  // 단계 표시
  $('st1').className='s on';
  $('st2').className='s'+(view==='lots'||view==='qty'||view==='qsum'?' on':'');
  $('st3').className='s'+(view==='qty'?' on':'');
  topBar.className='top'+(view!=='products'?' has-back':'');

  if(view==='products') renderProducts();
  else if(view==='lots') renderLots();
  else if(view==='qty') renderQty();
  else if(view==='quick') renderQuick();
  else if(view==='qsum') renderQsum();
}

function renderProducts(){
  $('title').textContent='에너지바 출고';
  $('sub').textContent='① 상품을 선택하세요';
  let h=`<div class="reload-row">
      <span class="hint" style="margin:0;">어떤 에너지바를 출고하나요?</span>
      <button class="reload-btn" onclick="loadFromSheet({btn:this})">🔄 재고 새로고침</button>
    </div>`;
  // [v3] QUICK 출고 입구
  // [v3.3] 입구 2개 — 주문 출고 / 수동 출고
  const ordN = (ORDERS && ORDERS.rows) ? ORDERS.rows : 0;
  h+=`<button class="quick-btn" onclick="goQuick('order')">
      <span>⚡ 주문 출고
        <div class="qb-sub">미출고 주문분${ordN?' '+ordN+'건':''} 자동으로 채우고, 이미 나간 건 빼줍니다</div>
      </span>
      <span class="qb-arrow">›</span>
    </button>`;
  h+=`<button class="quick-btn" style="background:linear-gradient(135deg,#123a43,#1f6d7d);border-color:#2f7f8f;" onclick="goQuick('manual')">
      <span>🧮 수동 출고
        <div class="qb-sub" style="color:#bfe4ec">서비스·샘플 등 주문 외 물량 — 수량을 직접 넣습니다</div>
      </span>
      <span class="qb-arrow">›</span>
    </button>`;
  PRODUCTS.forEach(p=>{
    const st=stockOf(p.code);
    h+=`<div class="prod" onclick="pickProduct('${p.code}')">
      <div><div class="pname"><span class="dot" style="background:${p.color}"></span>${p.name}</div>
      <div class="pcode">${p.code}</div></div>
      <div class="pstock"><div class="n">${st}</div><div class="l">총 재고</div></div>
    </div>`;
  });
  screen.innerHTML=h;
  // 하단: 최근 출고 내역 (시트에서 받아온 일반주문 기록 · v3.4부터 10일치)
  screen.innerHTML+=recentOutHTML();
  footer.innerHTML='';
}

// [v2] 최근 '일반주문' 출고 내역 HTML (시트 records 기준, 날짜별 묶음·최신순)
function nameOf(code){ const p=PRODUCTS.find(x=>x.code===code); return p?p.name:code; }
function fmtMD(ymd){
  const m=(ymd||'').match(/^(\d{4})-(\d{2})-(\d{2})/); if(!m) return ymd||'';
  const md=parseInt(m[2],10)+'/'+parseInt(m[3],10);
  return (ymd===SHEET_TODAY)? md+' (오늘)' : md;
}
function recentOutHTML(){
  let t='<div class="today"><h3>최근 출고 내역 (5일)</h3>';
  const rows=RECENTS.filter(r=>r.type==='일반주문' && r.qty>0);
  if(rows.length===0){ t+='<div class="empty">최근 5일 일반출고 없음</div>'; return t+'</div>'; }
  const groups=[], idx={};
  rows.forEach(r=>{
    if(!(r.date in idx)){ idx[r.date]=groups.length; groups.push({date:r.date, items:[], sum:0, byCode:{}}); }
    const g=groups[idx[r.date]]; g.items.push(r); g.sum+=r.qty;
    g.byCode[r.code]=(g.byCode[r.code]||0)+r.qty;
  });
  groups.forEach(g=>{
    t+=`<div class="thead">${fmtMD(g.date)}<span class="thead-sum">총 ${g.sum}개</span></div>`;
    t+=`<div class="thead-break">${breakdownLineO(g.byCode)}</div>`;
    g.items.forEach(o=>{
      t+=`<div class="tcard"><div class="tl">${nameOf(o.code)} · ${o.lot}${o.memo?' · '+o.memo:''}</div><div class="tr">${o.qty}개</div></div>`;
    });
  });
  t+='</div>';
  return t;
}
// [v2] 그날 종류별 소계 한 줄 (제품 순서, 0개는 생략). 약칭 = 코드 끝 2글자
function breakdownLineO(byCode){
  return PRODUCTS.filter(p=>byCode[p.code]>0)
    .map(p=>`<span class="bd"><span class="bd-c">${p.code.slice(-2)}</span> ${byCode[p.code]}개</span>`)
    .join('');
}

// ===== [v3] QUICK 출고 화면들 =====
function goQuick(mode){
  quickMode = (mode==='manual') ? 'manual' : 'order';
  if(quickMode==='manual'){ quickInputs={}; whyPick=''; whyEtc=''; }
  view='quick'; pushStep(); render();
}
// [v3.3] 기록 memo에 남길 사유 문자열. 주문 출고면 빈 값.
function whyMemo(){
  if(quickMode!=='manual' || !whyPick) return '';
  const etc=(whyPick==='기타' && whyEtc.trim()) ? ' '+whyEtc.trim() : '';
  return '['+whyPick+']'+etc;
}
function whyOk(){ return quickMode!=='manual' ? true : (!!whyPick && (whyPick!=='기타' || !!whyEtc.trim())); }
function pickWhy(i){ whyPick=WHY_LIST[i]||''; render(); }
function onWhyEtc(el){ whyEtc=el.value; const f=$('qsFooterBtn'); if(f) f.disabled=!whyOk(); }

// ① 주문 수량 입력 화면 (구성표 상품명 목록 그대로)
function renderQuick(){
  $('title').textContent = quickMode==='manual' ? '🧮 수동 출고' : '⚡ 주문 출고';
  $('sub').textContent = quickMode==='manual' ? '① 사유와 수량을 넣으세요' : '① 주문 수량을 입력하세요';
  let h='';
  if(!CALC.items.length){
    h+=`<div class="short-note">상품 목록(구성표)을 아직 못 받아왔어요.<br>인터넷 확인 후 아래 버튼을 누르세요.</div>
      <button class="reload-btn" onclick="loadFromSheet({btn:this})">🔄 재고 새로고침</button>`;
    screen.innerHTML=h; footer.innerHTML=''; return;
  }
  // [v3.3] 수동 출고 = 사유 먼저 고르고, 수량은 직접 넣는다 (자동 채우기·차감 없음)
  if(quickMode==='manual'){
    h+=`<div class="why-box ${whyOk()?'':'need'}">
      <div class="why-label">왜 나가나요? <span class="req">*</span></div>
      <div class="why-chips">` +
      WHY_LIST.map((w,i)=>`<button class="why-chip ${whyPick===w?'on':''}" onclick="pickWhy(${i})">${w}</button>`).join('') +
      `</div>` +
      (whyPick==='기타'
        ? `<input class="why-etc" placeholder="사유를 적어주세요" value="${whyEtc}" oninput="onWhyEtc(this)">` : '') +
      (whyOk()?'':`<div class="why-hint">⚠ 사유를 골라야 출고할 수 있어요</div>`) +
      `</div>`;
    h+='<div class="hint">내보낼 수량을 <b style="color:var(--accent)">직접</b> 넣으세요. 주문분은 빼지 않습니다.</div>';
  } else {
    h+='<div class="hint">송장 보면서 <b style="color:var(--accent)">주문 들어온 상품만</b> 수량을 넣으세요. 안 온 상품은 비워두면 됩니다.</div>';
  }
  if(quickMode==='order'){
  // [v3.4] 미출고 주문분 — 상태에 따라 4가지로 갈라 보여준다.
  //   버튼이 그냥 사라지면 "고장인가?" 와 구분이 안 된다. 항상 무언가를 띄운다.
  h += ordersBoxHTML();
  }   /* [v3.3] quickMode==='order' 블록 끝 */
  CALC.items.forEach((it,i)=>{
    const v=quickInputs[it.name]||'';
    h+=`<div class="qrow ${(parseInt(v)||0)>0?'has':''}" id="qrow${i}">
      <div class="qname">${it.name}</div>
      <input inputmode="numeric" value="${v}" placeholder="0" oninput="onQuickInput(${i},this)">
    </div>`;
  });
  screen.innerHTML=h;
  footer.innerHTML=`<button class="btn" onclick="goQsum()">필요수량 계산 →</button>`;
}
/* ═══════════ [v3.4] 미출고 주문분 — 상태별 표시 ═══════════ */

/** 창 시작일('YYYY-MM-DD'). 스크립트가 안 알려주면 빈 값 → 차감은 오늘만(안전한 쪽). */
function orderFrom(){ return (ORDERS && ORDERS.from) ? ORDERS.from : ''; }

/** 주문 집계 상자 HTML. 어떤 경우에도 빈 화면을 내보내지 않는다. */
function ordersBoxHTML(){
  // ① 아직 못 받아옴 / 통신 실패
  if(!ORDERS){
    const failed = (ORDERS_STATE==='fail');
    return `<div class="short-note">${failed
        ? '⏳ 주문을 <b>불러오지 못했어요</b> — 인터넷을 확인하고 다시 눌러주세요.'
        : '⏳ 주문을 <b>불러오는 중</b>이에요.'}</div>
      <button class="reload-btn" style="width:100%;text-align:center;margin-bottom:12px;"
        onclick="loadFromSheet({btn:this})">🔄 주문 다시 불러오기</button>`;
  }
  // ② 스크립트가 오류를 알려온 경우
  if(ORDERS.error){
    return `<div class="short-note">⚠️ 주문을 <b>못 읽었어요 — 확인 필요</b><br>
      ${String(ORDERS.error).slice(0,120)}<br>
      <b>대표님께 알려주세요.</b> 수량은 송장을 보고 직접 넣으셔도 됩니다.</div>
      <button class="reload-btn" style="width:100%;text-align:center;margin-bottom:12px;"
        onclick="loadFromSheet({btn:this})">🔄 주문 다시 불러오기</button>`;
  }

  const has = ORDERS.orders && Object.keys(ORDERS.orders).length > 0;
  let h='';

  // ③ 발송 건은 있는데 에너지바가 없음 (약과만 나간 경우)
  if(!has && (ORDERS.rows||0) > 0){
    h += `<div class="quick-banner done">
      <div class="qb-step">✅ 확인 완료</div>
      <div class="qb-main">발송 <b>${ORDERS.rows}건</b> — <b>에너지바 주문은 없습니다</b></div>
    </div>`;
  }
  // ④ 발송 건 자체가 0
  else if(!has){
    h += `<div class="quick-banner done">
      <div class="qb-step">✅ 확인 완료</div>
      <div class="qb-main"><b>미출고 주문이 없습니다</b></div>
    </div>`;
  }
  // 정상 — 자동 채우기 버튼
  else {
    h += `<button class="today-btn" onclick="loadOrderQty()">📥 미출고 주문분 자동으로 채우기 (주문 ${ORDERS.rows||0}건)</button>`;
  }

  // 매핑 안 된 상품 경고 (있으면 상태와 무관하게 띄운다)
  if(Array.isArray(ORDERS.unmapped) && ORDERS.unmapped.length){
    h += `<div class="short-note">⚠ 매핑 안 된 상품 — 아래는 수량에 <b>반영 안 됨</b>:<br>· ${ORDERS.unmapped.join('<br>· ')}<br><b>마스터 시트의 QUICK_매핑 탭에 한 줄 추가하면 다음부터 자동 반영됩니다.</b></div>`;
  }
  // 로그를 다 못 훑은 경우 경고
  if(ORDERS.truncated){
    h += `<div class="short-note">⚠ 주문 기록이 많아 <b>일부를 못 읽었을 수 있어요.</b> 대표님께 알려주세요.</div>`;

  return h;
}

// [v3.4] 미출고 주문분을 수량 입력에 채워넣기 (기존 입력은 지우고 새로 채움)
function loadOrderQty(){
  if(!ORDERS || !ORDERS.orders) return;
  quickInputs={};
  let matched=0;
  const missing=[];
  Object.keys(ORDERS.orders).forEach(name=>{
    const q=ORDERS.orders[name];
    if(q>0 && CALC.items.some(it=>it.name===name)){ quickInputs[name]=String(q); matched++; }
    else if(q>0) missing.push(name);
  });
  if(!Array.isArray(ORDERS.unmapped)) ORDERS.unmapped=[];
  missing.forEach(n=>{
    const tag=n+' (구성표에 없는 이름)';
    if(ORDERS.unmapped.indexOf(tag)===-1) ORDERS.unmapped.push(tag);
  });
  render();
  showToast(matched ? `📥 ${matched}종 자동으로 채웠어요<br>수량 확인 후 계산하세요` : '⚠ 채울 에너지바 주문이 없어요');
}

function onQuickInput(i,el){
  const v=el.value.replace(/[^0-9]/g,'');
  if(el.value!==v) el.value=v;
  const it=CALC.items[i]; if(!it) return;
  quickInputs[it.name]=v;
  const row=$('qrow'+i); if(row) row.classList.toggle('has', (parseInt(v)||0)>0);
}
// 입력값 × 구성표 → 5종 필요수량 합산
function computeNeeds(){
  const needs={};
  PRODUCTS.forEach(p=>needs[p.code]=0);
  CALC.items.forEach(it=>{
    const n=parseInt(quickInputs[it.name])||0;
    if(n<=0) return;
    PRODUCTS.forEach(p=>{ needs[p.code]+= n * (Number(it.mix[p.code])||0); });
  });
  return needs;
}
// [v3.2→v3.4] 창 안(최근 N일)에 이미 기록된 '일반주문' 출고 — 상품코드별 합계.
//   출처 = 시트에서 받아온 records(RECENTS). QUICK 출고도 '일반주문'으로 기록되므로 함께 잡힌다.
//   ★ 주문 창과 반드시 같은 창을 써야 한다.
//     주문은 10일치인데 차감이 오늘치뿐이면, 어제 이미 내보낸 물량을 또 내보내게 된다.
//   창 시작일을 모르면(구버전 스크립트) 오늘만 뺀다 — 적게 빼는 쪽이 안전하다.
function windowOutByCode(){
  const m={}; PRODUCTS.forEach(p=>m[p.code]=0);
  if(!SHEET_TODAY) return m;
  const from = orderFrom() || SHEET_TODAY;
  RECENTS.forEach(r=>{
    if(!r || r.type!=='일반주문') return;
    if(!r.date || r.date < from || r.date > SHEET_TODAY) return;
    // [v3.3] 수동 출고(서비스·샘플 등)는 주문분이 아니다 → 차감에서 뺀다.
    //   수동 출고는 memo에 '[사유]'가 붙는다. 주문 출고는 memo가 빈 값.
    if(String(r.memo||'').trim().charAt(0)==='[') return;
    const q=Number(r.qty)||0;
    if(q>0 && m[r.code]!=null) m[r.code]+=q;
  });
  return m;
}
// 이전 이름 별칭 유지

// [v3.2] 주문 필요수량(raw) − 창 안 기출고(out) = 남은 필요수량(net)
function computeNeedsNet(){
  const raw=computeNeeds();
  // [v3.3] 수동 출고는 '주문 − 기출고'라는 개념 자체가 없다 → 차감하지 않는다.
  const out=(quickDeduct && quickMode!=='manual') ? windowOutByCode() : {};
  const net={};
  PRODUCTS.forEach(p=>{ net[p.code]=Math.max(0,(raw[p.code]||0)-(out[p.code]||0)); });
  return {raw:raw, out:out, net:net};
}

function startQuick(){

function confirmOut(){
  if(!workerOk()){ showToast('⚠ 작업자(출고관리자)를<br>먼저 선택하세요'); return; }
  const l=LOTS.find(x=>x.lot===curLot);
  const n=parseInt(qty);
  const stockBefore=l.stock;       // 차감 전 재고 (참고용)
  const manager=currentWorker;
  l.stock-=n;                      // 화면 안에서 재고 차감
  todayOut.unshift({code:l.code,lot:l.lot,qty:n});
  justOut[l.lot]=(justOut[l.lot]||0)+n;
  // [v3] QUICK 중이면 남은 필요수량 차감
  if(quick && quick.remaining[l.code]!=null){
    quick.remaining[l.code]=Math.max(0, quick.remaining[l.code]-n);
  }

  // 구글 시트로 전송 — 그로스와 같은 통합 스크립트가 받는 형식으로 통일
  //   { type:'normal', otype:'일반주문', manager, lines:[{lot,qty,loss?,memo}] }
  //   loss는 깨짐·불량이 있을 때만 음수로 보냄(시트 G열). H=E−G 수식이 실출고를 계산.
  //   C(현재재고)·D(상품코드)·H(실출고)는 시트의 자동 수식이 채우므로 보내지 않음.
  const line={ lot:l.lot, qty:n, memo:whyMemo() };   // [v3.3] 수동 출고면 '[사유]' 기록
  if(loss>0) line.loss=-loss;          // 화면은 양수 입력 → 시트엔 음수로
  showToast(`전송 중…`);
  fetch(SHEET_URL,{
    method:'POST',
    body:JSON.stringify({
      type:'normal', otype:'일반주문', manager,
      lines:[line]
    })
  })
  .then(r=>r.text())
  .then(txt=>{
    let ok=false;
    try{ ok = JSON.parse(txt).ok===true; }catch(e){}
    if(ok) showToast(`✓ ${prodName(l.code)} ${l.lot}<br>${n}개${loss>0?' · 로스 '+loss+'개':''} 시트에 기록됨`);
    else showToast(`⚠ 기록 안 됨<br>다시 시도하세요`);
    if(ok) loadFromSheet();   // [v2] 최신 재고 + 최근 출고내역 다시 받아오기
  })
  .catch(err=>showToast(`⚠ 전송 오류<br>인터넷 확인 후 다시`));

  // 같은 상품의 LOT 목록으로 복귀 (여러 LOT 연달아 출고)
  curLot=null; qty=''; loss=0; history.back();
}
function showToast(msg){
  const t=$('toast'); t.innerHTML=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2400);
}
// ===== 시스템 뒤로가기(안드로이드 ← 버튼) 처리 =====
// 단계가 깊어질 때 히스토리를 한 칸 쌓고, 뒤로가기(popstate)가 오면 한 단계만 내려간다.
// 화면 안 ‹ 버튼·기록 후 복귀도 history.back()으로 통일 → "히스토리 1칸 = 화면 1단계" 유지.
// [v3] QUICK 계보: products → quick(입력) → qsum(확인) → lots → qty
function pushStep(){ history.pushState({view:view}, ''); }
function stepBack(){
  if(view==='qty'){ view='lots'; }
  else if(view==='lots'){
    if(quick){ view='qsum'; }
    else { view='products'; curProduct=null; justOut={}; }
  }
  else if(view==='qsum'){ view='quick'; }
  else if(view==='quick'){ quick=null; quickMode='order'; whyPick=''; whyEtc=''; view='products'; }
  render();
}
window.addEventListener('popstate', ()=>{ stepBack(); });
$('back').onclick=()=>{ history.back(); };  // 시스템 뒤로가기와 같은 경로로 처리
render();
loadFromSheet();   // 페이지 켜질 때 시트에서 작업자+LOT재고+오늘날짜+구성표 받아오기(실패해도 기본값으로 동작)
</script>
</body>
</html>
